{
    "port": 8000,

    "server_name": "potato annotator",

    "annotation_task_name": "Email understanding",

    # Potato will write the annotation file for all annotations to this
    # directory, as well as per-annotator output files and state information
    # necessary to restart annotation.
    "output_annotation_dir": "annotation_output/pilot-2/",

    # The output format for the all-annotator data. Allowed formats are:
    # * jsonl
    # * json (same output as jsonl)
    # * csv
    # * tsv
    #
    "output_annotation_format": "tsv",

    # If annotators are using a codebook, this will be linked at the top to the
    # instance for easy access
    "annotation_codebook_url": "",

    "data_files": [
       "data_files/pilot_30.csv"
    ],

    "item_properties": {
        "id_key": "message_id",
        "text_key": "message_body_clean",
    },

  #list_as_text is used when the input text is actually a list of texts, usually used for best-worst-scaling
  #"list_as_text": {
  #    "text_list_prefix_type": 'None',
  #    "horizontal": True,
  #  },

    "user_config": {

      "allow_all_users": True,

      "users": [  ],
    },

    #defining the ways annotators entering the annotation system
    "login": {
       "type": 'password',    #can be 'password' or 'url_direct'
       #"url_argument": 'PROLIFIC_PID' # when the login type is set to 'url_direct', 'url_argument' must be setup for a direct url argument login
    },

    #the jumping-to-id function will be disabled if "jumping_to_id_disabled" is True
    "jumping_to_id_disabled": False,

  #the navigation bar will be hidden to the annotators if "hide_navbar" is True
    "hide_navbar": True,


    "automatic_assignment": {
      #whether do automatic task assignment for annotators, default False.
      "on": True,
      "output_filename": 'task_assignment.json',
      "sampling_strategy": 'random',
      "labels_per_instance": 3,
      "instance_per_annotator": 20,
      "test_question_per_annotator": 0, # you must set up the test question in surveyflow to use this function

      "users": [  ],
    },


    # How many seconds do you want the annotators spend on each instance, after
    # that, an alert will be sent per alert_time_each_instance seconds.
    "alert_time_each_instance": 10000000,
    "horizontal_key_bindings": true,

    "annotation_schemes": [
        {
            "annotation_type": "radio",
            "name": "Sender Authority",
            "description": "Sender Authority",
            "labels": [
                {"name": "[A] Sender > Recipient", "tooltip": "Downward hierarchy = sender is likely emailing someone of lower rank", "key_value": "a"},
                {"name": "[S] Sender < Recipient", "tooltip": "Upward hierarchy = sender is likely emailing someone of higher rank", "key_value": "s"},
                {"name": "[D] Sender ~= Recipient", "tooltip": "Lateral hierarchy = sender and recipient seem to have the same rank", "key_value": "d"},
                {"name": "[F] Unclear", "tooltip": "Unclear who has higher rank", "key_value": "f"},
                {"name": "Other"}
            ],

            # If true, the field will have an optional text box the user can
            'has_free_response': {
               "instruction": 'Please specify:',
            },

            # adding requirements for labels, when "required" is True, the annotators will be asked to finish the current instance to proceed
            "label_requirement": {"required":True},

            # If true, numbers [1-len(labels)] will be bound to each
            # label. Aannotations with more than 10 are not supported with this
            # simple keybinding and will need to use the full item specification
            # to bind all labels to keys.
            #"sequential_key_binding": True,
        },
        {
            "annotation_type": "radio",
            "name": "Sender Expectation",
            "description": "Sender Expectation",
            "labels": [
                {"name": "[Q] Response Expected", "tooltip": "Sender likely expects the recipient to respond to the message — e.g., to answer a question, engage with content/attachments and send a follow up email, take some action outside the email chain and send a confirmation that the action was taken, etc. Sender explicitly or implicitly expects a response, such as followup or confirmation of said engagement.", "key_value": "q"},
                {"name": "[W] Response Not-Expected", "tooltip": "There is no indication in the email that the sender expects that the recipients will respond to the email.", "key_value": "w"},
                {"name": "[E] Not Applicable", "tooltip": "System generated or spam content.", "key_value": "e"},
                {"name": "Other"}
            ],

            # If true, the field will have an optional text box the user can
            'has_free_response': {
               "instruction": 'Please specify:',
            },

            # adding requirements for labels, when "required" is True, the annotators will be asked to finish the current instance to proceed
            "label_requirement": {"required":True},

            # If true, numbers [1-len(labels)] will be bound to each
            # label. Aannotations with more than 10 are not supported with this
            # simple keybinding and will need to use the full item specification
            # to bind all labels to keys.
            #"sequential_key_binding": True,
        },
        {
            "annotation_type": "multiselect",
            "name": "Email Act/Intent",
            "description": "Email Act/Intent",
            "labels": [
                {"name": "[1] Sharing Information", "tooltip": "The sender would like to share information or content with the recipient(s). This could include answering a question posed by the recipient; or proactively sharing information such as FYI messages, progress updates, status updates, or documents, external links/resources/references.", "key_value": 1},
                {"name": "[2] Requesting Information", "tooltip": "Denotes a scenario where the sender is requesting information that can be potentially responded to by sharing a document or a similar resource: asking a question, wanting more information, requesting explanations, followup queries, giving the recipient information or resources to take follow up actions if they wish but not asking for these steps, etc", "key_value": 2},
                {"name": "[3] Requesting/Proposing an Action", "tooltip": "The sender is asking the recipient to perform some activities that require some effort other than writing back. These actions are typically not immediately doable or require additional effort / activities that need to be completed before writing back – e.g., refactoring some code, conducting a survey. BUT NOT a request for something that is primarily internet research like looking up libraries or links.", "key_value": 3},
                {"name": "[4] Promising an Action", "tooltip": "The sender is committing to perform an action. Requires some form of affirmation - written agreement - from the sender’s side (definitive).", "key_value": 4},
                {"name": "[5] Personal Communication", "tooltip": "The email includes some indication that the sender is making an interpersonal investment in the recipient. Includes indicators that you have a relationship outside the email thread, personal self-disclosures, engagement with the recipient’s personal feelings (better word), or other communication that goes beyond the subject of the email and addresses the recipient as a person. Does not include pleasantries like please, thank you, expressions of gratitude, etc.", "key_value": 5},
                {"name": "[6] Pleasantries Only (mutually exclusive from the rest of options)", "tooltip": "The email contains only pleasantries or formalities (e.g., the whole email is a 'Thank you very much' or a 'Will try that, thanks!').", "key_value": 6},
                {"name": "[7] Auto-generated or Spam (mutually exclusive from the rest of options)", "tooltip": "Email digests, auto-reminders, github or auto-change notification messages, do not reply emails, scam emails, etc.", "key_value": 7},
                {"name": "Other"}
            ],

            # If true, the field will have an optional text box the user can
            'has_free_response': {
               "instruction": 'Please specify:',
            },

            # adding requirements for labels, when "required" is True, the annotators will be asked to finish the current instance to proceed
            "label_requirement": {"required":True},

            # If true, numbers [1-len(labels)] will be bound to each
            # label. Aannotations with more than 10 are not supported with this
            # simple keybinding and will need to use the full item specification
            # to bind all labels to keys.
            #"sequential_key_binding": True,
        },
    ],

    # The html that changes the visualiztation for your task. Change this file
    # to influence the layout and description of your task. This is not a full
    # HTML page, just the piece that does lays out your task's pieces
    #"html_layout": "templates/examples/fixed_keybinding_layout.html",
    "html_layout": "default",

    # The core UI files for Potato. You should not need to change these normally.
    #
    # Exceptions to this might include:
    # 1) You want to add custom CSS/fonts to style your task
    # 2) Your layout requires additional JS/assets to render
    # 3) You want to support additional keybinding magic
    #
    # if you want to use your own template,
    # please replace the string as a path to the template
    "base_html_template": "default",
    "header_file": "templates/header.html",

    # This is where the actual HTML files will be generated
    "site_dir": "default"

}
